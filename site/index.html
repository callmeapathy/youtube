<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Placements — Каталог YouTube-каналів</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Стилізація інтерактивного вибору зірочок */
    .star-rating-select {
      display: inline-flex;
      gap: 2px;
      cursor: pointer;
      user-select: none;
    }
    .star-rating-select span {
      color: #4a4a4a;
      transition: color 0.15s ease, transform 0.1s ease;
      font-size: 1.1em;
    }
    .star-rating-select span.active {
      color: #ffb400;
    }
    .star-rating-select:hover span {
      color: #ffb400;
    }
    .star-rating-select span:hover ~ span {
      color: #4a4a4a;
    }
    .star-rating-select span:active {
      transform: scale(1.2);
    }

    /* Стилізація кастомного дропдауну статусу під загальний темний дизайн */
    .status-select-dropdown {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.85em;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .status-select-dropdown:hover, .status-select-dropdown:focus {
      border-color: #555;
      background: #252525;
    }
    .status-select-dropdown option {
      background: #141414;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>YT Placements</h1>
      <p class="subtitle">Каталог YouTube-каналів української аудиторії — whitelist / blacklist для Google Ads</p>
    </header>

    <!-- ФІЛЬТРИ -->
    <section class="filters-card">
      <div class="filters-grid">
        <div class="filter-group">
          <label>ПОШУК</label>
          <input type="text" id="search-input" placeholder="назва або ID каналу" />
        </div>

        <div class="filter-group">
          <label>КРАЇНА ПОХОДЖЕННЯ</label>
          <select id="country-filter" multiple size="4">
            <option value="" selected>Усі країни</option>
          </select>
          <span class="filter-hint">Ctrl / ⌘ + клик — показати всі</span>
        </div>

        <div class="filter-group">
          <label>ТИП КАНАЛУ</label>
          <select id="type-filter" multiple size="4">
            <option value="" selected>Усі типи</option>
          </select>
          <span class="filter-hint">показати всі</span>
        </div>

        <div class="filter-group">
          <label>ТЕМАТИКА КОНТЕНТУ</label>
          <select id="category-filter" multiple size="4">
            <option value="" selected>Усі тематики</option>
          </select>
          <span class="filter-hint">показати всі</span>
        </div>

        <div class="filter-group">
          <label>МОВА</label>
          <select id="language-filter" multiple size="4">
            <option value="" selected>Усі мови</option>
          </select>
          <span class="filter-hint">показати всі</span>
        </div>

        <div class="filter-group">
          <label>ОЦІНКА ЯКОСТІ</label>
          <select id="quality-filter">
            <option value="">Будь-яка</option>
            <option value="5">5 зірок</option>
            <option value="4">4+ зірки</option>
            <option value="3">3+ зірки</option>
          </select>
        </div>

        <div class="filter-group">
          <label>СЕР. ПЕРЕГЛЯДИ / МІС — ВІД</label>
          <input type="number" id="views-min-input" placeholder="0" />
        </div>
      </div>

      <div class="filter-group status-group">
        <label>СТАТУС У СПИСКАХ</label>
        <select id="status-filter">
          <option value="">Усі</option>
          <option value="white">Whitelist</option>
          <option value="black">Blacklist</option>
          <option value="new">New</option>
        </select>
      </div>
    </section>

    <!-- ПАНЕЛЬ ДІЙ -->
    <section class="actions-bar">
      <div class="counter-info">
        <span id="rendered-count">0</span> з <span id="total-count">0</span> каналів — обрано <strong id="selected-count">0</strong>
      </div>
      <div class="buttons-group">
        <button id="select-all-btn" class="btn btn-secondary">Обрати всі відфільтровані</button>
        <button id="deselect-all-btn" class="btn btn-secondary">Зняти виділення</button>
        <button id="export-csv-btn" class="btn btn-primary">↓ CSV</button>
        <button id="export-xlsx-btn" class="btn btn-primary">↓ XLSX</button>
      </div>
    </section>

    <!-- ТАБЛИЦЯ -->
    <main class="table-container">
      <table id="channels-table">
        <thead>
          <tr>
            <th class="col-checkbox"><input type="checkbox" id="master-checkbox" /></th>
            <th class="col-channel">КАНАЛ</th>
            <th class="col-country">КРАЇНА</th>
            <th class="col-type">ТИП</th>
            <th class="col-category">ТЕМАТИКА</th>
            <th class="col-lang">МОВА</th>
            <th class="col-subs">ПІДПИСНИКИ</th>
            <th class="col-views">СЕР. ПЕРЕГЛЯДИ / МІС</th>
            <th class="col-videos">ВІДЕО / МІС</th>
            <th class="col-quality">ЯКІСТЬ</th>
            <th class="col-status">СТАТУС</th>
          </tr>
        </thead>
        <tbody id="channels-tbody">
          <!-- Динамічні рядки -->
        </tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Генерація прямих зірочок для точного вибору
    function renderStarRating(channelId, currentRating) {
      let html = `<div class="star-rating-select" data-id="${channelId}">`;
      for (let i = 1; i <= 5; i++) {
        const activeClass = i <= currentRating ? 'active' : '';
        html += `<span class="${activeClass}" data-value="${i}" onclick="updateChannelRating('${channelId}', ${i})">★</span>`;
      }
      html += `</div>`;
      return html;
    }

    // Генерація випадаючого списку статусу
    function renderStatusDropdown(channelId, currentStatus) {
      return `
        <select class="status-select-dropdown" onchange="updateChannelStatus('${channelId}', this.value)">
          <option value="white" ${currentStatus === 'white' ? 'selected' : ''}>whitelist</option>
          <option value="black" ${currentStatus === 'black' ? 'selected' : ''}>blacklist</option>
          <option value="new" ${currentStatus === 'new' ? 'selected' : ''}>new</option>
        </select>
      `;
    }

    // Функція оновлення зірок на бекенді
    async function updateChannelRating(id, rating) {
      try {
        const res = await fetch(`/api/channels/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating })
        });
        if (!res.ok) throw new Error();
        if (typeof loadChannels === 'function') loadChannels();
      } catch (e) {
        alert("Не вдалося зберегти зміну");
      }
    }

    // Функція оновлення статусу на бекенді
    async function updateChannelStatus(id, status) {
      try {
        const res = await fetch(`/api/channels/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (!res.ok) throw new Error();
        if (typeof loadChannels === 'function') loadChannels();
      } catch (e) {
        alert("Не вдалося зберегти зміну");
      }
    }
  </script>
</body>
</html>
