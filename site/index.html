<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Placements — Каталог YouTube-каналів</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #12100e;
      color: #e5e0d8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .star-rating span {
      cursor: pointer;
      transition: color 0.15s ease-in-out;
    }
    .star-rating:hover span {
      color: #fbbf24;
    }
    .star-rating span:hover ~ span {
      color: #4b5563;
    }
    select {
      background-color: #1c1917;
      color: #e5e0d8;
    }
  </style>
</head>
<body class="p-6 max-w-7xl mx-auto">
  <header class="mb-8">
    <h1 class="text-3xl font-bold text-amber-500 mb-2">YT Placements</h1>
    <p class="text-stone-400">Каталог YouTube-каналів української аудиторії — whitelist / blacklist для Google Ads</p>
  </header>

  <!-- Фільтри -->
  <section class="bg-stone-900/60 p-6 rounded-xl border border-stone-800 mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
    <div>
      <label class="block text-xs uppercase tracking-wider text-stone-400 mb-2">Пошук</label>
      <input type="text" id="search-input" placeholder="назва або ID каналу" class="w-full bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
    </div>

    <div>
      <label class="block text-xs uppercase tracking-wider text-stone-400 mb-2">Статус у списках</label>
      <select id="status-filter" class="w-full border border-stone-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
        <option value="all">усі</option>
        <option value="white">whitelist</option>
        <option value="black">blacklist</option>
        <option value="new">new</option>
      </select>
    </div>

    <div>
      <label class="block text-xs uppercase tracking-wider text-stone-400 mb-2">Тип каналу</label>
      <select id="type-filter" class="w-full border border-stone-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
        <option value="all">усі типи</option>
        <option value="Медіа">Медіа</option>
        <option value="Блогер">Блогер</option>
        <option value="Паблік">Паблік</option>
        <option value="Бренд">Бренд</option>
      </select>
    </div>

    <div>
      <label class="block text-xs uppercase tracking-wider text-stone-400 mb-2">Тематика</label>
      <select id="category-filter" class="w-full border border-stone-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
        <option value="all">усі тематики</option>
        <option value="Ігри">Ігри</option>
        <option value="Музика">Музика</option>
        <option value="Розваги">Розваги</option>
        <option value="Новини та політика">Новини та політика</option>
        <option value="Блоги">Блоги</option>
        <option value="Наука та технології">Наука та технології</option>
        <option value="Спорт">Спорт</option>
        <option value="Фільми та анімація">Фільми та анімація</option>
        <option value="Освіта">Освіта</option>
      </select>
    </div>
  </section>

  <!-- Таблиця -->
  <section class="bg-stone-900/60 rounded-xl border border-stone-800 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-stone-800/80 text-stone-400 uppercase text-xs tracking-wider">
          <tr>
            <th class="p-4">Канал</th>
            <th class="p-4">Країна</th>
            <th class="p-4">Тип</th>
            <th class="p-4">Тематика</th>
            <th class="p-4">Мова</th>
            <th class="p-4">Підписники</th>
            <th class="p-4">Якість</th>
            <th class="p-4">Статус</th>
          </tr>
        </thead>
        <tbody id="channels-table-body" class="divide-y divide-stone-800">
          <tr>
            <td colspan="8" class="p-8 text-center text-stone-500">Завантаження каналів...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    let channels = [];

    async function loadChannels() {
      try {
        const res = await fetch('/api/channels');
        channels = await res.json();
        renderChannels();
      } catch (err) {
        console.error(err);
        document.getElementById('channels-table-body').innerHTML = `
          <tr><td colspan="8" class="p-8 text-center text-red-500">Помилка завантаження даних</td></tr>
        `;
      }
    }

    function renderChannels() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const status = document.getElementById('status-filter').value;
      const type = document.getElementById('type-filter').value;
      const category = document.getElementById('category-filter').value;

      const filtered = channels.filter(c => {
        const matchSearch = (c.name || '').toLowerCase().includes(search) || (c.id || '').toLowerCase().includes(search);
        const matchStatus = status === 'all' || c.status === status;
        const matchType = type === 'all' || c.type === type;
        const matchCategory = category === 'all' || c.category === category;
        return matchSearch && matchStatus && matchType && matchCategory;
      });

      const tbody = document.getElementById('channels-table-body');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-stone-500">Каналів не знайдено</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(c => `
        <tr class="hover:bg-stone-800/40 transition">
          <td class="p-4 font-medium">
            <a href="https://youtube.com/channel/${c.id}" target="_blank" class="text-amber-400 hover:underline block">${escapeHtml(c.name || c.id)}</a>
            <span class="text-xs text-stone-500">${c.id}</span>
          </td>
          <td class="p-4 text-stone-400">${c.country || '—'}</td>
          <td class="p-4 text-stone-400">${c.type || '—'}</td>
          <td class="p-4 text-stone-400">${c.category || '—'}</td>
          <td class="p-4 text-stone-400">${c.language || '—'}</td>
          <td class="p-4 text-stone-300 font-mono">${(c.subscribers || 0).toLocaleString()}</td>
          <td class="p-4">
            ${renderStarSelector(c.id, c.quality || 0)}
          </td>
          <td class="p-4">
            ${renderStatusDropdown(c.id, c.status || 'black')}
          </td>
        </tr>
      `).join('');
    }

    function renderStarSelector(id, quality) {
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        const color = i <= quality ? 'text-amber-400' : 'text-stone-600';
        stars += `<span class="${color} text-lg px-0.5 cursor-pointer hover:text-amber-300" onclick="updateChannel('${id}', { rating: ${i} })">★</span>`;
      }
      return `<div class="star-rating inline-flex">${stars}</div>`;
    }

    function renderStatusDropdown(id, currentStatus) {
      return `
        <select onchange="updateChannel('${id}', { status: this.value })" class="bg-stone-800 border border-stone-700 rounded px-2 py-1 text-xs focus:outline-none focus:border-amber-500">
          <option value="white" ${currentStatus === 'white' ? 'selected' : ''}>whitelist</option>
          <option value="black" ${currentStatus === 'black' ? 'selected' : ''}>blacklist</option>
          <option value="new" ${currentStatus === 'new' ? 'selected' : ''}>new</option>
        </select>
      `;
    }

    async function updateChannel(id, patchData) {
      try {
        const res = await fetch(`/api/channels/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patchData)
        });

        if (!res.ok) throw new Error('Failed');

        // Оновлюємо локальний масив
        const ch = channels.find(item => item.id === id);
        if (ch) {
          if (patchData.rating !== undefined) ch.quality = patchData.rating;
          if (patchData.status !== undefined) ch.status = patchData.status;
        }

        renderChannels();
      } catch (e) {
        alert('Не вдалося зберегти зміну');
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById('search-input').addEventListener('input', renderChannels);
    document.getElementById('status-filter').addEventListener('change', renderChannels);
    document.getElementById('type-filter').addEventListener('change', renderChannels);
    document.getElementById('category-filter').addEventListener('change', renderChannels);

    loadChannels();
  </script>
</body>
</html>
